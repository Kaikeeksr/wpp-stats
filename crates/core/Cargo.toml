[package]
name = "wpp-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
bincode = "1.3"
bytecount = "0.6"
csv = "1.3"
dirs = "7"
jiff = "0.2"
krilla = "0.7"
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skrifa = "0.37"
thiserror = "2"
unicode-normalization = "0.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"
