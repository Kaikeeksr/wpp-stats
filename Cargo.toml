[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]
exclude = ["crates/core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wpp-core]
opt-level = 3
